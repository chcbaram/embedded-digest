name: daily-digest

on:
  schedule:
    # 07:00 KST = 22:00 UTC (전날)
    - cron: "0 22 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "전송하지 않고 로그에만 출력"
        type: boolean
        default: false
      notifiers:
        description: "전달 채널 (쉼표 구분). 비우면 저장소 변수/기본값 사용"
        type: string
        default: ""

permissions:
  contents: write      # state/seen.json 커밋
  issues: write        # 다이제스트 이슈 발행

concurrency:
  group: daily-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: 다이제스트 실행
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL || 'claude-sonnet-5' }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NOTIFIERS: ${{ inputs.notifiers || vars.NOTIFIERS || 'slack,github_issue' }}
        run: |
          python main.py ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: seen.json 커밋
        if: ${{ !inputs.dry_run }}
        run: |
          if git diff --quiet -- state/seen.json; then
            echo "변경 없음"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/seen.json
          git commit -m "chore: update seen.json ($(date -u +%Y-%m-%d))"
          git push
